<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <!-- Header -->
    <header class="app__header">
      <h1 class="app__title">Sales Picker</h1>
      <p class="app__description">
        顧客を検索して、カスタムフィールドへ反映します。
      </p>
    </header>

    <!-- Search view -->
    <section id="search-view">
      <section class="app__section">
        <label class="label" for="search-input">検索</label>
        <input
          id="search-input"
          class="input"
          type="search"
          placeholder="会社名 または 登録番号 で検索"
          autocomplete="off"
        />
      </section>

      <section class="app__section">
        <button id="fetch-sales-button" class="button button--primary" type="button">
          Salesを検索
        </button>
      </section>
    </section>

    <!-- Results view -->
    <section id="results-view" hidden>
      <section class="app__section app__section--compact">
        <button id="back-to-search-button" class="button button--compact" type="button">
          検索へ戻る
        </button>
      </section>

      <section class="app__section app__section--compact">
        <label id="sales-select-label" class="label" for="sales-select">候補</label>
        <select id="sales-select" class="select select--compact" size="4"></select>
      </section>

      <section id="preview-section" class="app__section app__section--compact">
        <h2 class="section-title">プレビュー</h2>
        <table class="preview-table">
          <tbody id="preview"></tbody>
        </table>

        <button id="insert-button" class="button button--primary" type="button">
          カスタムフィールドへ反映
        </button>
      </section>
    </section>

    <p id="status-message" class="status-message" aria-live="polite"></p>
  </main>

  <script src="https://static.zdassets.com/zendesk_app_framework_sdk/2.0/zaf_sdk.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
